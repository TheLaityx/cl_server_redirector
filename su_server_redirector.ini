[su_server_redirector]
; 你的私人服务器地址（必填，改成你的服务器）
; 支持 http 和 https；可带端口和基础路径，例如 https://example.com:8443/nr
SU_SERVER_URL = http://你的服务器IP:10901

; 私服访问密码（服务端校验 passkey 请求头；不用密码则留空）
SU_SERVER_PASSWORD =

; 分片（shard）名称：匹配隔离的唯一依据，16 字符内
; 相同 shard 名的玩家才能互相匹配，起个独特的名字（如 MyPack_v1）
SU_CUSTOM_SHARD_NAME =

; 忽略 HTTPS 证书错误（自签名证书时保持 1）
; 1 = 忽略所有证书错误, 0 = 严格校验
SU_DISABLE_SSL_CHECK = 1

; 使用独立存档（游戏存档 .sl2 会被重定向为同名 .co2，不影响官服存档）
; 1 = 启用, 0 = 关闭。如果用 ModEngine 的 altSave 功能请设为 0 避免冲突
SU_USE_ALT_SAVE = 1

; ===== 调试开关（正常使用时不要改）=====
; 排障用：设为 1 可跳过对应子系统的挂钩，逐项排查闪退原因
;SU_DISABLE_EOS_STUB = 0
;SU_DISABLE_WINHTTP_HOOK = 0
;SU_DISABLE_STEAM_HOOK = 0
