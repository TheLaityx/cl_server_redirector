[su_server_redirector]
; 你的私人服务器地址（必填）
; 格式：http://<IP>:<端口> 或 https://<域名>
; 示例：http://192.168.1.100:10901
; 示例：https://nightreign.example.com
SU_SERVER_URL =

; 私服访问密码（如果服务端设置了 passkey，则此处填入相同密码；无密码留空）
SU_SERVER_PASSWORD =

; 分片（shard）名称：匹配隔离的唯一依据，16 字符内
; 所有联机玩家必须使用相同的 shard 名，否则互相匹配不到
; 示例：MyPack_v1
SU_CUSTOM_SHARD_NAME =

; 忽略 HTTPS 证书错误（自签名证书时设为 1）
; 1 = 忽略所有证书错误, 0 = 严格校验
SU_DISABLE_SSL_CHECK = 1

; 使用独立存档（游戏存档 .sl2 会被重定向为同名 .co2，不影响官服存档）
; 1 = 启用, 0 = 关闭。如果用 ModEngine 的 altSave 功能请设为 0 避免冲突
SU_USE_ALT_SAVE = 1

; ===== 调试开关（正常使用时不要改）=====
; 排障用：设为 1 可跳过对应子系统的挂钩，逐项排查闪退原因
;SU_DISABLE_EOS_STUB = 0
;SU_DISABLE_WINHTTP_HOOK = 0
;SU_DISABLE_STEAM_HOOK = 0
