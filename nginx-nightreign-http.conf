server {
    listen 80;
    server_name xn--luqs27a.top www.xn--luqs27a.top;

    # 日志
    access_log /var/log/nginx/nightreign.access.log;
    error_log /var/log/nginx/nightreign.error.log;

    # 禁止直接暴露上游端口扫描（可选）
    # 如果后续加 Cloudflare，这里可以限制只允许 Cloudflare IP 段

    location / {
        proxy_pass http://127.0.0.1:10901;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # HTTP/1.1 + Connection 保持（防止 502）
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 长连接/大 body 超时（游戏可能 POST 22KB+ 票据）
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        client_max_body_size 50M;

        # 缓冲关闭，实时转发（游戏对延迟敏感）
        proxy_buffering off;
    }
}
