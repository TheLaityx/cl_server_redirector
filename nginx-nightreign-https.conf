server {
    listen 80;
    server_name xn--luqs27a.top www.xn--luqs27a.top;

    # HTTP 强制跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name xn--luqs27a.top www.xn--luqs27a.top;

    # SSL 证书路径（用 certbot 申请后会自动填充）
    ssl_certificate /etc/letsencrypt/live/xn--luqs27a.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--luqs27a.top/privkey.pem;

    # SSL 安全参数
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';

    # 日志
    access_log /var/log/nginx/nightreign.access.log;
    error_log /var/log/nginx/nightreign.error.log;

    location / {
        proxy_pass http://127.0.0.1:10901;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        client_max_body_size 50M;
        proxy_buffering off;
    }
}
